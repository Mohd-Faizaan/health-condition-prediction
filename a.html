// 4. Magnet Component (Mouse follow hover utility)
interface MagnetProps {
  children: React.ReactNode;
  padding?: number;
  strength?: number;
  activeTransition?: string;
  inactiveTransition?: string;
  className?: string;
}
const Magnet: React.FC<MagnetProps> = ({
  children,
  padding = 150,
  strength = 3,
  activeTransition = "transform 0.3s ease-out",
  inactiveTransition = "transform 0.6s ease-in-out",
  className = ""
}) => {
  const ref = useRef<HTMLDivElement>(null);
  const [transform, setTransform] = useState("translate3d(0px, 0px, 0px)");

  const handleMouseMove = (e: MouseEvent) => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const distanceX = e.clientX - centerX;
    const distanceY = e.clientY - centerY;
    const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

    if (distance < padding) {
      const moveX = distanceX / strength;
      const moveY = distanceY / strength;
      setTransform(`translate3d(${moveX}px, ${moveY}px, 0px) scale(1.05)`);
      if (ref.current) {
        ref.current.style.transition = activeTransition;
      }
    } else {
      setTransform("translate3d(0px, 0px, 0px) scale(1)");
      if (ref.current) {
        ref.current.style.transition = inactiveTransition;
      }
    }
  };

  const handleMouseLeave = () => {
    setTransform("translate3d(0px, 0px, 0px) scale(1)");
    if (ref.current) {
      ref.current.style.transition = inactiveTransition;
    }
  };

  useEffect(() => {
    window.addEventListener("mousemove", handleMouseMove);
    return () => {
      window.removeEventListener("mousemove", handleMouseMove);
    };
  }, [padding, strength]);

  return (
    <div
      ref={ref}
      onMouseLeave={handleMouseLeave}
      style={{ 
        transform,
        willChange: 'transform'
      }}
      className={`inline-block ${className}`}
    >
      {children}
    </div>
  );
};

// 5. Animated Character-by-Character text opacity scroller
interface AnimatedTextProps {
  text: string;
  className?: string;
}
const AnimatedText: React.FC<AnimatedTextProps> = ({ text, className = "" }) => {
  const containerRef = useRef<HTMLParagraphElement>(null);
  
  // Track scroll relative to character container
  const { scrollYProgress } = useScroll({
    target: containerRef,
    offset: ["start 0.8", "end 0.2"]
  });

  const words = useMemo(() => text.split(" "), [text]);
  const chars = useMemo(() => {
    let charIndex = 0;
    return words.map((word) => {
      const splitWord = word.split("").map((char) => ({
        char,
        globalIndex: charIndex++
      }));
      // Add a trailing space to maintain whitespace
      splitWord.push({ char: " ", globalIndex: charIndex++ });
      return splitWord;
    });
  }, [words]);

  const totalCharsCount = useMemo(() => chars.flat().length, [chars]);

  return (
    <p ref={containerRef} className={`${className} flex flex-wrap justify-center`}>
      {chars.map((word, wordIdx) => (
        <span key={`word-${wordIdx}`} className="inline-flex whitespace-nowrap">
          {word.map(({ char, globalIndex }) => {
            // Determine scroll opacity mapping for this specific character
            const startFraction = globalIndex / totalCharsCount;
            const endFraction = (globalIndex + 1) / totalCharsCount;
            
            return (
              <CharacterWrapper 
                key={`char-${globalIndex}`} 
                char={char} 
                progress={scrollYProgress} 
                range={[startFraction, endFraction]} 
              />
            );
          })}
        </span>
      ))}
    </p>
  );
};

// Simple internal wrapper to handle character transform tracking individually
interface CharacterWrapperProps {
  char: string;
  progress: any;
  range: [number, number];
}
const CharacterWrapper: React.FC<CharacterWrapperProps> = ({ char, progress, range }) => {
  const opacity = useTransform(progress, range, [0.2, 1.0]);
  return (
    <span className="relative inline-block">
      {/* Invisible placeholder for layout layout flow */}
      <span className="opacity-0">{char === " " ? "\u00A0" : char}</span>
      <motion.span 
        style={{ opacity }} 
        className="absolute left-0 top-0 text-[#D7E2EA]"
      >
        {char === " " ? "\u00A0" : char}
      </motion.span>
    </span>
  );
};

// --- SUPPORTING MARQUEE ROW SECTION IMPLEMENTATION ---
function MarqueeSection() {
  const containerRef = useRef<HTMLDivElement>(null);
  const [scrollYOffset, setScrollYOffset] = useState(0);

  useEffect(() => {
    const handleScroll = () => {
      if (!containerRef.current) return;
      const rect = containerRef.current.getBoundingClientRect();
      const sectionTop = rect.top + window.scrollY;
      
      // Calculate delta based on viewport scroll matching instructions
      const offset = (window.scrollY - sectionTop + window.innerHeight) * 0.35;
      setScrollYOffset(offset);
    };

    window.addEventListener("scroll", handleScroll, { passive: true });
    // Initial compute
    handleScroll();

    return () => {
      window.removeEventListener("scroll", handleScroll);
    };
  }, []);

  // Split images array into 2 distinct rows as instructed
  const row1Images = MARQUEE_IMAGES.slice(0, 11);
  const row2Images = MARQUEE_IMAGES.slice(11);

  // Triple images sequence to guarantee seamless loop visual scrolling
  const tripledRow1 = [...row1Images, ...row1Images, ...row1Images];
  const tripledRow2 = [...row2Images, ...row2Images, ...row2Images];

  // Translations based on scroll computed limits
  const row1Translation = scrollYOffset - 250;
  const row2Translation = -(scrollYOffset - 250);

  return (
    <section 
      ref={containerRef} 
      className="relative overflow-hidden bg-[#0C0C0C] pt-24 pb-10 sm:pt-32 md:pt-40"
    >
      <div className="flex flex-col gap-4">
        
        {/* Row 1 - Translates RIGHT on Scroll */}
        <div className="w-full overflow-hidden whitespace-nowrap py-1">
          <div 
            style={{ 
              transform: `translateX(${row1Translation}px)`,
              willChange: 'transform'
            }}
            className="flex gap-4 w-max transition-transform duration-100 ease-out"
          >
            {tripledRow1.map((url, i) => (
              <div 
                key={`r1-img-${i}`}
                className="relative shrink-0 rounded-2xl overflow-hidden bg-[#18181B]"
                style={{ width: '380px', height: '240px' }}
              >
                <img 
                  src={url} 
                  alt="Motion Graphics Loop" 
                  loading="lazy"
                  className="w-full h-full object-cover rounded-2xl opacity-80 hover:opacity-100 transition-opacity duration-300"
                  onError={(e) => {
                    // Failback random aesthetic design gradient
                    e.currentTarget.src = `https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&q=80&w=600`;
                  }}
                />
              </div>
            ))}
          </div>
        </div>

        {/* Row 2 - Translates LEFT on Scroll */}
        <div className="w-full overflow-hidden whitespace-nowrap py-1">
          <div 
            style={{ 
              transform: `translateX(${row2Translation}px)`,
              willChange: 'transform'
            }}
            className="flex gap-4 w-max transition-transform duration-100 ease-out"
          >
            {tripledRow2.map((url, i) => (
              <div 
                key={`r2-img-${i}`}
                className="relative shrink-0 rounded-2xl overflow-hidden bg-[#18181B]"
                style={{ width: '380px', height: '240px' }}
              >
                <img 
                  src={url} 
                  alt="Motion Design Preview" 
                  loading="lazy"
                  className="w-full h-full object-cover rounded-2xl opacity-80 hover:opacity-100 transition-opacity duration-300"
                  onError={(e) => {
                    e.currentTarget.src = `https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=600`;
                  }}
                />
              </div>
            ))}
          </div>
        </div>

      </div>
    </section>
  );
}


// --- SUPPORTING STICKY PROJECT CARD PATTERN ---
interface ProjectCardProps {
  project: {
    id: string;
    name: string;
    category: string;
    liveUrl: string;
    col1Img1: string;
    col1Img2: string;
    col2Img: string;
  };
  index: number;
  total: number;
  onContactClick: () => void;
}

const ProjectCard: React.FC<ProjectCardProps> = ({ project, index, total, onContactClick }) => {
  const cardRef = useRef<HTMLDivElement>(null);

  // Measure scroll metrics inside cards tracking space
  const { scrollYProgress } = useScroll({
    target: cardRef,
    offset: ["start end", "start start"]
  });

  // Scale calculations: targetScale = 1 - (total - 1 - index) * 0.03
  const targetScale = 1 - (total - 1 - index) * 0.03;
  const scale = useTransform(scrollYProgress, [0.8, 1], [1, targetScale]);
  
  // Custom stacking offsets
  const topOffset = index * 28;

  return (
    <div 
      ref={cardRef} 
      className="sticky top-24 md:top-32 w-full flex flex-col items-center justify-center z-10"
      style={{ 
        paddingTop: `${topOffset}px`,
        minHeight: "75vh"
      }}
    >
      <motion.div 
        style={{ scale }}
        className="w-full bg-[#0C0C0C] border-2 border-[#D7E2EA]/30 rounded-[40px] sm:rounded-[50px] md:rounded-[60px] p-6 sm:p-8 md:p-10 shadow-[0_30px_70px_rgba(0,0,0,0.9)] overflow-hidden"

              <span className="text-xs font-semibold uppercase tracking-widest text-purple-400">
                {project.category}
              </span>
              <h3 className="text-2xl sm:text-3xl md:text-4xl font-extrabold text-white tracking-wide uppercase">
                {project.name}

          </div>

          <div className="flex gap-4">

        </div>

        {/* 2-Column Responsive Image Grid Layout */}
        <div className="grid grid-cols-1 md:grid-cols-10 gap-6">
